services:
  chroma:
    image: chromadb/chroma:0.5.5
    container_name: rag-chroma
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  ollama:
    image: ollama/ollama:0.13.3
    container_name: rag-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  api:
    profiles: ['api']
    build: .
    container_name: rag-api
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - CHROMA_URL=http://chroma:8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=llama3:8b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - COLLECTION_NAME=mvp_docs
    depends_on:
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  chroma_data:
    name: rag_chroma_data
  ollama_data:
    name: rag_ollama_data
